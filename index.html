<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111113">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Novel Link Mobile - คัดลอกลิงก์นิยายจากมือถือ">

  <!-- PWA / Home Screen -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

  <!-- iPhone / iPad standalone mode -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Novel Link">
  <meta name="mobile-web-app-capable" content="yes">

  <title>Novel Link Mobile</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand-block">
        <img class="brand-logo" src="logo-512.png" alt="Novel Link Mobile">
        <div>
          <div class="eyebrow">Novel Link Notebook</div>
          <h1>คัดลอกลิงก์นิยาย</h1>
        </div>
      </div>
      <button id="refreshBtn" class="icon-button" type="button" aria-label="รีเฟรชข้อมูล" title="รีเฟรชข้อมูล">↻</button>
    </header>

    <nav class="tabs" aria-label="หมวดนิยาย">
      <button class="tab active" data-category="green" type="button">Darkness Novel</button>
      <button class="tab" data-category="blue" type="button">แปลนิยายตามใจฉัน</button>
      <button class="tab" data-category="red" type="button">Twilight Novel</button>
    </nav>

    <section class="control-card">
      <label for="datePicker">วันที่</label>
      <input id="datePicker" type="date">
      <div class="meta-row">
        <span id="countText">กำลังโหลด...</span>
        <button id="resetCopiedBtn" class="text-button" type="button">ล้างสีปุ่มวันนี้</button>
      </div>
    </section>

    <section>
      <div id="buttonGrid" class="button-grid" aria-live="polite"></div>
      <div id="emptyState" class="empty-state" hidden>
        ไม่พบรายการในหมวดและวันที่นี้
      </div>
    </section>

    <footer class="footer">
      <div id="lastUpdated">อัปเดตข้อมูล: -</div>
      <div class="hint">แตะรหัสเพื่อคัดลอกข้อความ • ปุ่มที่เคยกดจะเปลี่ยนเป็นสีเขียว</div>
    </footer>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
